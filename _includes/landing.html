<div class="hero text-center p-4">

  <div class="hero-photo mx-auto my-2">
    <div id="container">
      <div id="dummy"></div>
      <div id="element">
        <img src="{{ site.author.image }}" alt="{{ site.title }}" class="circle-image wow animated zoomIn" data-wow-delay=".1s">
      </div>
    </div>
  </div>

  <p class="hero-eyebrow wow animated fadeIn" data-wow-delay=".1s">Corporate Finance &rarr; Data Science &amp; AI</p>

  <h1 class="hero-headline text-themed wow animated fadeIn" data-wow-delay=".15s">{{ site.author.name }}</h1>

  <p class="hero-subhead text-muted wow animated slideInUp" data-wow-delay=".2s">{{ site.description }}</p>

  <div class="hero-cta wow animated fadeIn" data-wow-delay=".25s">
    <a href="{{ '/projects/' | relative_url }}" class="btn btn-primary">View Projects</a>
    <a href="{{ '/about/' | relative_url }}" class="btn btn-outline-primary">My Story</a>
  </div>

  <div class="hero-stats">
    {% for stat in site.data.herostats %}
    <div class="hero-stat wow animated fadeIn" data-wow-delay="{{ forloop.index | divided_by: 10.0 | plus: 0.2 }}s">
      <div class="num">{{ stat.number }}</div>
      <div class="label text-themed">{{ stat.label }}</div>
    </div>
    {% endfor %}
  </div>

</div>
